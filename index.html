<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALI-TV</title>
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(16, 23, 38, 0.78);
      --card-border: rgba(157, 78, 221, 0.35);
      --neon-blue: #00b0ff;
      --neon-purple: #9d4edd;
      --neon-green: #25d366;
      --text-gold: #f4c430;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      padding-bottom: 95px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* FONDO VECTORIAL TECNOLÓGICO FIJO */
    .fixed-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .fixed-bg svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CABECERA Y LOGO */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 12px;
      position: relative;
      z-index: 10;
    }

    .logo-container {
      width: 230px;
      height: 230px;
      max-width: 82vw;
      max-height: 82vw;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 28px rgba(157, 78, 221, 0.85)) drop-shadow(0 0 14px rgba(46, 233, 255, 0.45));
      transition: transform 0.2s ease;
    }

    .logo-container:active {
      transform: scale(0.98);
    }

    .logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* BUSCADOR */
    .search-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 0 14px;
      margin-bottom: 14px;
      position: relative;
      z-index: 10;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(18, 25, 41, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(157, 78, 221, 0.45);
      box-shadow: 0 4px 18px rgba(0,0,0,0.5), inset 0 0 12px rgba(157, 78, 221, 0.12);
      border-radius: 25px;
      padding: 10px 16px;
    }

    .search-box svg {
      width: 18px;
      height: 18px;
      fill: #8e9bb5;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #8e9bb5;
    }

    /* GRILLA DE PRODUCTOS (2 COLUMNAS) */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 14px;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), inset 0 0 12px rgba(157, 78, 221, 0.08);
    }

    .card-img-wrap {
      width: 100%;
      height: 120px;
      background: #000;
      position: relative;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.3;
      min-height: 34px;
      margin-bottom: 6px;
    }

    .card-price {
      color: var(--text-gold);
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(244, 196, 48, 0.4);
    }

    /* BOTONES DE ACCIÓN EN TARJETA */
    .card-actions {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: auto;
    }

    .btn-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 1;
      transition: transform 0.1s;
    }
    .btn-circle:active { transform: scale(0.90); }

    .btn-ws { background: #134e29; }
    .btn-cart-sm { background: #101c36; }
    .btn-eye { background: #581c87; }

    .btn-ws svg { fill: #25d366; width: 16px; height: 16px; }
    .btn-eye svg { fill: #c084fc; width: 16px; height: 16px; }

    /* BOTONES FLOTANTES UNO AL LADO DEL OTRO */
    .floating-buttons {
      position: fixed;
      right: 16px;
      bottom: 20px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      z-index: 999;
    }

    /* CARRITO FLOTANTE AZUL NEÓN CON HALO */
    .float-cart-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #000000;
      border: 2px solid var(--neon-blue);
      box-shadow: 0 0 20px 4px rgba(157, 78, 221, 0.85), inset 0 0 10px rgba(0, 176, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #f4c430;
      color: #000;
      font-weight: 900;
      font-size: 11px;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #000;
    }

    /* WHATSAPP FLOTANTE */
    .float-ws-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #25d366;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      text-decoration: none;
    }
    .float-ws-btn svg { width: 30px; height: 30px; fill: #ffffff; }

    /* FOOTER Y BOTÓN EDITAR */
    .footer {
      text-align: center;
      padding: 24px 16px 14px;
      font-size: 11px;
      color: #8e9bb5;
      position: relative;
      z-index: 10;
    }

    .edit-cat-btn {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(147, 51, 234, 0.55);
      color: #c084fc;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal-content {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(157, 78, 221, 0.5);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #1f2937;
      border: none;
      color: #9ca3af;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    /* TECLADO PIN */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 250px;
      margin: 14px auto 0;
    }

    .key-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .key-btn:active { background: #9d4edd; }

    /* CARRITO LATERAL */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: rgba(13, 18, 28, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-left: 1px solid rgba(157, 78, 221, 0.4);
      z-index: 10000;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .cart-drawer.open { right: 0; }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      margin: 16px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(21, 29, 47, 0.8);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid rgba(157, 78, 221, 0.2);
    }

    .qty-btn {
      background: #23314f;
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-checkout {
      background: #25d366;
      color: #000;
      font-weight: 800;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ADMIN */
    .admin-tab {
      background: #1f2937;
      border: none;
      color: #9ca3af;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .admin-tab.active { background: #9d4edd; color: #fff; }

    .input-field {
      width: 100%;
      background: #1b253b;
      border: 1px solid #2e3e60;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .btn-save {
      background: #9d4edd;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }

    .upload-zone {
      border: 2px dashed #4b5563;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      background: #151d2f;
      margin-bottom: 12px;
    }

    .order-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .order-btn:hover { background: #9d4edd; }
  </style>
</head>
<body>

  <!-- FONDO VECTORIAL TECNOLÓGICO FIJO -->
  <div class="fixed-bg">
    <svg viewBox="0 0 1000 1500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Degradado Base Espacial -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0a061c"/>
          <stop offset="35%" stop-color="#190e38"/>
          <stop offset="70%" stop-color="#2c114f"/>
          <stop offset="100%" stop-color="#0d0722"/>
        </linearGradient>

        <!-- Esferas 3D Púrpura -->
        <radialGradient id="sphereGrad1" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#bb65ff"/>
          <stop offset="45%" stop-color="#7a22e0"/>
          <stop offset="85%" stop-color="#400b87"/>
          <stop offset="100%" stop-color="#1a0438"/>
        </radialGradient>

        <radialGradient id="sphereGrad2" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#c471ed"/>
          <stop offset="50%" stop-color="#841be3"/>
          <stop offset="90%" stop-color="#3b0870"/>
          <stop offset="100%" stop-color="#14022a"/>
        </radialGradient>

        <!-- Hexágonos translúcidos -->
        <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(196, 113, 237, 0.22)"/>
          <stop offset="100%" stop-color="rgba(122, 34, 224, 0.05)"/>
        </linearGradient>

        <linearGradient id="hexSolid" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)"/>
          <stop offset="100%" stop-color="rgba(157, 78, 221, 0.18)"/>
        </linearGradient>

        <!-- Nodos de luz neón -->
        <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
          <stop offset="40%" stop-color="#00b0ff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#00b0ff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Fondo Degradado -->
      <rect width="1000" height="1500" fill="url(#bgGrad)"/>

      <!-- Luces ambientales -->
      <circle cx="850" cy="250" r="300" fill="#9d4edd" opacity="0.18" filter="blur(60px)"/>
      <circle cx="150" cy="1150" r="320" fill="#7a22e0" opacity="0.22" filter="blur(70px)"/>
      <circle cx="120" cy="300" r="220" fill="#400b87" opacity="0.25" filter="blur(50px)"/>

      <!-- ONDAS CONCÉNTRICAS ARRIBA A LA IZQUIERDA -->
      <g stroke="rgba(187, 101, 255, 0.25)" fill="none" stroke-width="1.5">

        <circle cx="280" cy="120" r="70"/>
        <circle cx="280" cy="120" r="90"/>
        <circle cx="280" cy="120" r="110"/>
        <circle cx="280" cy="120" r="130"/>
      </g>
      <circle cx="310" cy="170" r="22" fill="url(#sphereGrad2)"/>

      <!-- ESFERA PRINCIPAL 3D ARRIBA -->
      <g>
        <circle cx="130" cy="280" r="68" fill="url(#sphereGrad1)"/>
        <circle cx="130" cy="280" r="88" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" stroke-dasharray="2, 10" fill="none"/>
        <circle cx="250" cy="310" r="12" fill="url(#sphereGrad2)"/>
      </g>

      <!-- ONDAS CONCÉNTRICAS ABAJO A LA DERECHA -->
      <g stroke="rgba(187, 101, 255, 0.22)" fill="none" stroke-width="1.5">
        <circle cx="680" cy="1320" r="40"/>
        <circle cx="680" cy="1320" r="65"/>
        <circle cx="680" cy="1320" r="90"/>
        <circle cx="680" cy="1320" r="115"/>
        <circle cx="680" cy="1320" r="140"/>
      </g>
      <circle cx="670" cy="1330" r="25" fill="url(#sphereGrad2)"/>

      <!-- ESFERA PRINCIPAL 3D ABAJO -->
      <g>
        <circle cx="860" cy="1160" r="78" fill="url(#sphereGrad1)"/>
        <circle cx="860" cy="1160" r="102" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" stroke-dasharray="2, 11" fill="none"/>
        <circle cx="760" cy="980" r="10" fill="url(#sphereGrad2)"/>
      </g>

      <!-- RED HEXAGONAL ARRIBA DERECHA -->
      <g stroke="rgba(187, 101, 255, 0.4)" stroke-width="2">
        <polygon points="780,100 840,65 900,100 900,170 840,205 780,170" fill="url(#hexSolid)"/>
        <polygon points="840,205 900,170 960,205 960,275 900,310 840,275" fill="url(#hexFill)"/>
        <polygon points="720,205 780,170 840,205 840,275 780,310 720,275" fill="none"/>
        <polygon points="780,310 840,275 900,310 900,380 840,415 780,380" fill="url(#hexFill)"/>
        <polygon points="840,415 900,380 960,415 960,485 900,520 840,485" fill="none"/>
        <polygon points="720,415 780,380 840,415 840,485 780,520 720,485" fill="url(#hexFill)"/>
        <polygon points="900,100 960,65 1020,100 1020,170 960,205 900,170" fill="url(#hexFill)"/>
      </g>
      <circle cx="840" cy="205" r="4" fill="#ffffff"/>
      <circle cx="840" cy="205" r="14" fill="url(#glowDot)"/>
      <circle cx="900" cy="310" r="4" fill="#00e5ff"/>
      <circle cx="900" cy="310" r="14" fill="url(#glowDot)"/>
      <circle cx="780" cy="380" r="3.5" fill="#ffffff"/>
      <circle cx="840" cy="415" r="3.5" fill="#00e5ff"/>

      <!-- RED HEXAGONAL ABAJO IZQUIERDA -->
      <g stroke="rgba(187, 101, 255, 0.42)" stroke-width="2">
        <polygon points="60,780 120,745 180,780 180,850 120,885 60,850" fill="url(#hexFill)"/>
        <polygon points="120,885 180,850 240,885 240,955 180,990 120,955" fill="none"/>
        <polygon points="180,780 240,745 300,780 300,850 240,885 180,850" fill="none"/>
        <polygon points="60,990 120,955 180,990 180,1060 120,1095 60,1060" fill="url(#hexSolid)"/>
        <polygon points="180,990 240,955 300,990 300,1060 240,1095 180,1060" fill="url(#hexFill)"/>
        <polygon points="120,1095 180,1060 240,1095 240,1165 180,1200 120,1165" fill="none"/>
        <polygon points="240,1095 300,1060 360,1095 360,1165 300,1200 240,1165" fill="url(#hexFill)"/>
        <polygon points="100,1230 150,1200 200,1230 200,1290 150,1320 100,1290" fill="url(#hexFill)"/>
      </g>
      <circle cx="180" cy="850" r="4" fill="#ffffff"/>

      <circle cx="240" cy="1165" r="14" fill="url(#glowDot)"/>

      <!-- Cruces tecnológicas finas '+' -->
      <g stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5">
        <line x1="140" y1="140" x2="154" y2="140"/><line x1="147" y1="133" x2="147" y2="147"/>
        <line x1="740" y1="710" x2="754" y2="710"/><line x1="747" y1="703" x2="747" y2="717"/>
        <line x1="935" y1="945" x2="949" y2="945"/><line x1="942" y1="938" x2="942" y2="952"/>
      </g>
    </svg>
  </div>

  <!-- CABECERA CON LOGO VECTORIAL -->
  <header class="header">
    <div class="logo-container" id="brandLogoWrap">
      <svg viewBox="0 0 500 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="spraySpill" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <rect width="500" height="500" fill="#000000" rx="24"/>

        <!-- X Morada Angular Grafiti -->
        <g fill="#9313ff">
          <polygon points="120,40 180,40 460,320 460,380 400,380 60,100" />
          <polygon points="380,40 320,40 40,320 40,380 100,380 440,100" />

        <circle cx="50" cy="350" r="4.5" fill="#9313ff"/>
        <circle cx="450" cy="350" r="4" fill="#9313ff"/>

        <!-- CONEJO GRAFITI VERDE NEÓN -->
        <g stroke="#84f828" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#spraySpill)">
          <path d="M 215 205 C 190 120, 150 70, 190 85 C 220 100, 230 155, 238 200" />
          <path d="M 262 200 C 270 155, 280 100, 310 85 C 350 70, 310 120, 285 205" />
          <path d="M 195 210 C 160 235, 160 280, 205 315 C 240 335, 260 335, 295 315 C 340 280, 340 235, 305 210 Z" />
          <path d="M 205 265 C 225 295, 275 295, 295 265" stroke-width="14" />
        </g>

        <!-- Gotas de pintura verde -->
        <g fill="#84f828">
          <path d="M 168 120 Q 166 160 168 175 Q 168 180 166 180 Q 164 180 164 175 Z" />
          <circle cx="166" cy="183" r="3.5" />
          <path d="M 322 135 Q 320 175 322 195 Q 322 200 320 200 Q 318 200 318 195 Z" />
          <circle cx="320" cy="204" r="3.5" />
          <path d="M 215 315 L 215 338 Q 215 343 213 343 Q 211 343 211 338 Z" />
          <circle cx="213" cy="346" r="3" />
          <path d="M 250 325 L 250 355 Q 250 360 248 360 Q 246 360 246 355 Z" />
          <circle cx="248" cy="363" r="3.2" />
          <path d="M 285 315 L 285 340 Q 285 345 283 345 Q 281 345 281 340 Z" />
          <circle cx="283" cy="348" r="3" />
          <circle cx="185" cy="285" r="2.8" />
          <circle cx="315" cy="285" r="2.8" />
        </g>

        <!-- Colmillos / Dientes -->
        <g stroke="#84f828" stroke-width="7" stroke-linecap="round">
          <line x1="225" y1="276" x2="225" y2="292" />
          <line x1="275" y1="276" x2="275" y2="292" />
        </g>

        <!-- OJOS EN CRUZ ROJA (XX) -->
        <g stroke="#e60000" stroke-width="11" stroke-linecap="round" filter="url(#spraySpill)">

  <script>
    // PRODUCTOS PREDETERMINADOS
    const DEFAULT_PRODUCTS = [
      {
        id: 1,
        title: "Ea Sport FIFA 26 original steam",
        price: 70000,
        img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&q=80",

      {

        title: "IPTV ali tv - pantalla",
        price: 6000,
        img: "https://images.unsplash.com/photo-1593784991095-a205069470b6?w=500&q=80",
        desc: "Más de 3,000 canales en vivo, películas y series en alta definición full HD/4K."
      },
      {
        id: 3,
        title: "Paramount plus - pantalla",
        price: 6000,
        img: "https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?w=500&q=80",
        desc: "Perfil privado con pin de seguridad por 30 días de servicio garantizado."
      },
      {
        id: 4,
        title: "Disney+ Premium",
        price: 8000,
        img: "https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?w=500&q=80",
        desc: "Disney, Star, ESPN y todo el contenido deportivo sin interrupciones."
      }
    ];

    // MIGRACIÓN Y LIMPIEZA DE DATOS PREVIOS
    let savedProducts = JSON.parse(localStorage.getItem('ali_products'));
    if (savedProducts) {
      savedProducts = savedProducts.map(p => {
        let cleanTitle = p.title.replace(/streaming/gi, '').trim();
        return {
          id: p.id || Date.now(),
          title: cleanTitle || p.title,
          price: p.price || 0,
          img: p.img || 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=500&q=80',
          desc: p.desc || 'Servicio garantizado con entrega inmediata.'
        };
      });
      localStorage.setItem('ali_products', JSON.stringify(savedProducts));
    }

    // ESTADO
    let products = savedProducts || DEFAULT_PRODUCTS;
    let cart = JSON.parse(localStorage.getItem('ali_cart')) || [];
    let tempProductImage = '';
    let config = JSON.parse(localStorage.getItem('ali_cfg')) || {
      phone: '573022863191',
      msgSingle: 'Hola ALI-TV, me interesa adquirir: {producto} por ${precio} COP.'
    };

    function formatCOP(num) {
      return '$ ' + Number(num).toLocaleString('es-CO');
    }

    // RENDERIZAR PRODUCTOS
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = products.filter(p => p.title.toLowerCase().includes(search));

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-img-wrap">
            <img src="${p.img}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1593784991095-a205069470b6?w=500&q=80'">
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-price">${formatCOP(p.price)}</div>
            <div class="card-actions">
              <button class="btn-circle btn-ws" title="Consultar por WhatsApp" onclick="directWhatsApp(${p.id})">
                <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2M12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.04 20.15C10.56 20.15 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.81 7.37 7.5 3.67 12.05 3.67Z"/></svg>
              </button>
              <button class="btn-circle btn-cart-sm" title="Agregar al Carrito" onclick="addToCart(${p.id})">
                <svg viewBox="0 0 512 512" width="16" height="16" fill="none" stroke="#00b0ff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M 40 100 L 120 100 L 180 320 L 420 320 C 445 320 465 295 475 240 L 160 240" />
                  <line x1="220" y1="180" x2="380" y2="180" />
                  <line x1="225" y1="215" x2="370" y2="215" />
                  <circle cx="210" cy="385" r="26" fill="#00b0ff" stroke="none" />
                  <circle cx="390" cy="385" r="26" fill="#00b0ff" stroke="none" />
                </svg>
              </button>
              <button class="btn-circle btn-eye" title="Ver Detalles" onclick="showProductDetails(${p.id})">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      renderProducts();
    }

    // REORDENAR PRODUCTOS
    function moveProduct(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= products.length) return;
      const item = products.splice(idx, 1)[0];
      products.splice(targetIdx, 0, item);
      localStorage.setItem('ali_products', JSON.stringify(products));
      renderProducts();
      renderAdminProducts();
    }

    // CARRITO
    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;
      const exist = cart.find(item => item.id === id);
      if (exist) {
        exist.qty += 1;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      updateCart();
    }

    function updateCart() {
      localStorage.setItem('ali_cart', JSON.stringify(cart));
      const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById('cartCount').textContent = totalCount;

      const list = document.getElementById('cartItemsList');
      let total = 0;
      if (cart.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: #64748b; padding: 30px 0;">Tu carrito está vacío</div>`;
      } else {
        list.innerHTML = cart.map((item, idx) => {
          total += item.price * item.qty;
          return `
            <div class="cart-item">
              <div>
                <div style="font-size: 13px; font-weight: 600;">${item.title}</div>
                <div style="font-size: 12px; color: #f4c430;">${formatCOP(item.price)}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                <span style="font-size: 13px; font-weight: 700;">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
              </div>
            </div>
          `;
        }).join('');
      }
      document.getElementById('cartTotal').textContent = formatCOP(total);
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      updateCart();
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('open');
    }

    // DISPARADOR WHATSAPP
    function launchWhatsApp(phone, message) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const url = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(message)}`;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function directWhatsApp(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;
      let msg = config.msgSingle
        .replace('{producto}', prod.title)
        .replace('{precio}', Number(prod.price).toLocaleString('es-CO'));
      launchWhatsApp(config.phone, msg);
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) return;
      let total = 0;
      let text = `🛒 *PEDIDO ALI-TV*\n\n`;
      cart.forEach(item => {
        text += `• ${item.qty}x ${item.title} - ${formatCOP(item.price * item.qty)}\n`;
        total += item.price * item.qty;
      });
      text += `\n*TOTAL A PAGAR:* ${formatCOP(total)}\n\nPor favor indícame los medios de pago disponibles.`;
      launchWhatsApp(config.phone, text);
    }

    // DETALLES
    function showProductDetails(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;
      document.getElementById('detailBody').innerHTML = `
        <h3 style="color: #f4c430; margin-bottom: 6px;">${prod.title}</h3>
        <div style="font-size: 18px; font-weight: 800; color: #fff; margin: 12px 0;">${formatCOP(prod.price)}</div>
        <img src="${prod.img}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;">
        <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; white-space: pre-line;">${prod.desc || 'Servicio original garantizado con soporte y entrega inmediata por WhatsApp.'}</p>
        <button class="btn-checkout" onclick="addToCart(${prod.id}); closeModals(); toggleCart();">Añadir al Carrito</button>
      `;
      document.getElementById('detailModal').style.display = 'flex';
    }

    // CLAVE Y TECLADO PIN
    function openPinModal() {
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').style.display = 'none';
      document.getElementById('pinModal').style.display = 'flex';
    }

    function pressPin(digit) {
      const pinField = document.getElementById('pinInput');
      if (pinField.value.length < 6) {
        pinField.value += digit;
      }
      if (pinField.value.length === 6) {
        verifyPinDirect();
      }
    }

    function clearPin() {
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').style.display = 'none';
    }

    function verifyPinDirect() {
      const pin = document.getElementById('pinInput').value;
      if (pin === '860315') {
        document.getElementById('pinModal').style.display = 'none';
        openAdminModal();
      } else {
        document.getElementById('pinError').style.display = 'block';
        setTimeout(() => clearPin(), 1000);
      }
    }

    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
      renderAdminProducts();
    }

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }

    function showAdminTab(tab) {
      document.getElementById('tabProd').style.display = tab === 'prod' ? 'block' : 'none';
      document.getElementById('tabMsg').style.display = tab === 'msg' ? 'block' : 'none';
      document.getElementById('tabLogo').style.display = tab === 'logo' ? 'block' : 'none';

      document.getElementById('tabBtnProd').classList.toggle('active', tab === 'prod');
      document.getElementById('tabBtnMsg').classList.toggle('active', tab === 'msg');
      document.getElementById('tabBtnLogo').classList.toggle('active', tab === 'logo');
    }

    // COMPRESIÓN DE IMÁGENES
    function compressImageFile(file, maxWidth, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleProductImage(input) {
      if (input.files && input.files[0]) {
        compressImageFile(input.files[0], 500, function(dataUrl) {
          tempProductImage = dataUrl;
          document.getElementById('prodPreviewTag').src = dataUrl;
          document.getElementById('prodImgPreview').style.display = 'block';
          document.getElementById('prodUploadText').textContent = '✓ Foto cargada';
        });
      }
    }

    function handleLogoUpload(input) {
      if (input.files && input.files[0]) {
        compressImageFile(input.files[0], 400, function(dataUrl) {
          localStorage.setItem('ali_custom_logo', dataUrl);
          applySavedLogo();
          alert('¡Logo actualizado con éxito!');
        });
      }
    }

    function resetDefaultLogo() {
      localStorage.removeItem('ali_custom_logo');
      location.reload();
    }

    function applySavedLogo() {
      const saved = localStorage.getItem('ali_custom_logo');
      if (saved) {
        document.getElementById('brandLogoWrap').innerHTML = `<img src="${saved}" alt="ALI-TV" style="max-width:100%; max-height:100%; object-fit:contain;">`;
      }
    }

    function renderAdminProducts() {
      const list = document.getElementById('adminProductList');
      list.innerHTML = products.map((p, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px 10px; border-radius:6px; margin-bottom:6px; font-size:12px;">
          <div style="display:flex; align-items:center; gap:6px; overflow:hidden;">
            <span style="color:#f4c430; font-weight:700; font-size:11px;">#${idx + 1}</span>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px;">${p.title}</span>
          </div>
          <div style="display:flex; align-items:center; gap:4px;">
            <button class="order-btn" title="Subir" onclick="moveProduct(${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''}>▲</button>
            <button class="order-btn" title="Bajar" onclick="moveProduct(${idx}, 1)" ${idx === products.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>▼</button>
            <button onclick="editProduct(${idx})" style="background:#2563eb; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Editar</button>
            <button onclick="deleteProduct(${idx})" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">✕</button>
          </div>
        </div>
      `).join('');
    }

    function editProduct(idx) {
      const p = products[idx];
      document.getElementById('prodEditIndex').value = idx;
      document.getElementById('prodTitle').value = p.title;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodDesc').value = p.desc || '';
      tempProductImage = p.img;
      document.getElementById('prodPreviewTag').src = p.img;
      document.getElementById('prodImgPreview').style.display = 'block';
      document.getElementById('prodUploadText').textContent = '✓ Foto actual';
    }

    function saveProduct() {
      const idx = parseInt(document.getElementById('prodEditIndex').value);
      const title = document.getElementById('prodTitle').value.trim();
      const price = parseInt(document.getElementById('prodPrice').value) || 0;
      const desc = document.getElementById('prodDesc').value.trim() || 'Servicio original garantizado con soporte y entrega inmediata.';
      const img = tempProductImage || 'https://images.unsplash.com/photo-1593784991095-a205069470b6?w=500&q=80';

      if (!title) {
        alert('Ingresa el título del producto');
        return;
      }

      if (idx >= 0) {
        products[idx] = { ...products[idx], title, price, desc, img };
      } else {
        products.push({ id: Date.now(), title, price, desc, img });
      }

      localStorage.setItem('ali_products', JSON.stringify(products));
      
      // Limpiar formulario
      document.getElementById('prodEditIndex').value = -1;
      document.getElementById('prodTitle').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodDesc').value = '';
      tempProductImage = '';
      document.getElementById('prodImgPreview').style.display = 'none';
      document.getElementById('prodUploadText').textContent = '📷 Toca aquí para subir foto desde la galería';

      renderProducts();
      renderAdminProducts();
      alert('Producto guardado correctamente.');
    }

    function deleteProduct(idx) {
      if (confirm('¿Eliminar este producto?')) {
        products.splice(idx, 1);
        localStorage.setItem('ali_products', JSON.stringify(products));
        renderProducts();
        renderAdminProducts();
      }
    }

    function saveConfig() {
      config.phone = document.getElementById('cfgPhone').value.trim().replace(/[^0-9]/g, '');
      config.msgSingle = document.getElementById('cfgMsgSingle').value;
      localStorage.setItem('ali_cfg', JSON.stringify(config));
      document.getElementById('floatWsLink').href = `https://api.whatsapp.com/send?phone=${config.phone}`;
      alert('Configuración guardada.');
    }

    // INICIAR
    applySavedLogo();
    renderProducts();
    updateCart();
  </script>
</body>
</html>
